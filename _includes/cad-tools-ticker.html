    /* Vos options de style "Carte Moderne" conservées */

    /* Effet de brillance au survol */

        content: '';

    .tool-item:hover::before {

    [data-theme='dark'] .tool-item:hover {

.contact-container::before {

    left: -50%;

    background: linear-gradient(
        45deg,
        transparent,
        rgba(255, 255, 255, 0.1),

    );

}

@keyframes shimmer {

    50% { transform: rotate(45deg) translateY(100%); }
}

/* Mode sombre glassmorphism */
[data-theme='dark'] .contact-container {

.input-group input,

.input-group textarea {

/* Bouton glassmorphism */
.submit-btn {
    background: linear-gradient(135deg, rgba(0, 123, 255, 0.9), rgba(0, 86, 179, 0.9));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: white;
    padding: 16px 32px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 123, 255, 0.3);
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 123, 255, 0.4);
}

.submit-btn:hover::before {
    width: 300px;
    height: 300px;
}

.submit-btn:active {
    transform: translateY(-1px);
}

.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.submit-btn.loading {
    pointer-events: none;
}

.submit-btn.loading::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    top: 50%;
    left: 50%;
    margin-left: -10px;
    margin-top: -10px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    z-index: 2;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Notification glassmorphism */
.notification {
    position: fixed;
    top: 30px;
    right: 30px;
    background: linear-gradient(135deg, rgba(76, 217, 100, 0.95), rgba(52, 199, 89, 0.95));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: white;
    padding: 20px 30px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 12px 40px rgba(76, 217, 100, 0.4);
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 600;
    font-size: 1rem;
    z-index: 10000;
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
               slideOut 0.4s ease 2.6s;
    opacity: 0;
}

.notification.show {
    opacity: 1;
}

.notification.error {
    background: linear-gradient(135deg, rgba(255, 59, 48, 0.95), rgba(255, 45, 85, 0.95));
    box-shadow: 0 12px 40px rgba(255, 59, 48, 0.4);
}

.notification-icon {
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
}

@keyframes slideIn {
    from {
        transform: translateX(450px) scale(0.8);
        opacity: 0;
    }
    to {
        transform: translateX(0) scale(1);
        opacity: 1;
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateX(450px) scale(0.8);
        opacity: 0;
    }
}

/* Bordures animées pour l'effet glassmorphism */
.contact-container::after {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;

    z-index: -1;

}

.contact-container:hover::after {
