<style>
    .viewer-container-wrapper {
        margin: 30px auto;
        max-width: 900px;
    }

    /* On utilise votre classe de carte existante */
    .viewer-card {
        background: var(--rec-card-bg, rgba(255, 255, 255, 0.7));
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--rec-card-border, rgba(255, 255, 255, 0.2));
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .canvas-frame {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: #1a1a2e; /* Fond sombre pour la 3D */
        height: 450px;
    }

    #canvas-3d { width: 100%; height: 100%; display: block; }

    /* Badge Statut style "In development" */
    .dev-badge-overlay {
        position: absolute;
        top: 15px; left: 15px;
        background: rgba(0, 123, 255, 0.15);
        color: #007bff;
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 700;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 123, 255, 0.3);
        z-index: 5;
    }

    /* Boutons de contrôle (Style boutons CAD Tools) */
    .viewer-btns-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .v-btn-modern {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(0, 123, 255, 0.2);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
        color: var(--global-text-color);
    }

    .v-btn-modern:hover {
        background: #fff;
        color: #007bff;
        transform: translateY(-2px);
    }

    .v-btn-modern.active {
        background: linear-gradient(135deg, #007bff, #00c6ff);
        color: white;
        border: none;
    }
</style>

<div class="viewer-container-wrapper">
    <div class="viewer-card">
        <div class="canvas-frame" id="canvas-container">
            <div class="dev-badge-overlay"><i class="fas fa-hammer"></i> Under Development</div>
            <canvas id="canvas-3d"></canvas>
        </div>

        <div class="viewer-btns-group">
            <button class="v-btn-modern active" id="btn-solid" onclick="setRenderMode('solid')">🎨 Solide</button>
            <button class="v-btn-modern" id="btn-wireframe" onclick="setRenderMode('wireframe')">🕸️ Filaire</button>
            <button class="v-btn-modern" onclick="resetCamera()">🔄 Reset</button>
            <button class="v-btn-modern" onclick="toggleRotation()">▶️ Auto-Rotate</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    /* TOUTES VOS FONCTIONS JAVASCRIPT CI-DESSOUS */

    // Telles qu'elles sont dans votre fichier original.

    function init() {
        const canvas = document.getElementById('canvas-3d');
        // ... votre logique d'initialisation ...

</script>
