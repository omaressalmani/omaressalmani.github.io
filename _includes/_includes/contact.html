<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    /* Variables pour adaptation Light/Dark */
    :root {
        --contact-text-main: #1a1a1a;
        --contact-text-secondary: #666;
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-border: rgba(0, 123, 255, 0.1);
        --glass-shine: rgba(255, 255, 255, 0.2);
        --input-bg: rgba(255, 255, 255, 0.7);
    }

    [data-theme='dark'] {
        --contact-text-main: #ffffff;
        --contact-text-secondary: #bbb;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.1);
        --glass-shine: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(255, 255, 255, 0.08);
    }

    .contact-section {
        padding: 80px 20px;
        font-family: 'Poppins', sans-serif;
    }

    .contact-container {
        max-width: 700px;
        margin: 0 auto;
    }

    /* Header élégant */
    .contact-title {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        font-style: italic;
        font-weight: 700;
        color: var(--contact-text-main);
        margin-bottom: 10px;
        text-align: center;
        transition: color 0.3s ease;
    }

    .contact-subtitle {
        font-size: 1rem;
        color: var(--contact-text-secondary);
        font-weight: 400;
        text-align: center;
        margin-bottom: 50px;
    }

    /* Carte du formulaire */
    .contact-form {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
        transition: all 0.4s ease;
    }

    .contact-form:hover {
        border-color: rgba(0, 123, 255, 0.3);
        box-shadow: 0 15px 45px rgba(0, 123, 255, 0.2);
    }

    /* Effet brillance */
    .contact-form::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, var(--glass-shine), transparent);
        transform: rotate(45deg);
        transition: 0.6s;
        opacity: 0;
        pointer-events: none;
    }

    .contact-form:hover::before {
        opacity: 1;
        left: 100%;
    }

    /* Input groups */
    .input-group {
        margin-bottom: 20px;
        position: relative;
    }

    .input-group input,
    .input-group textarea {
        width: 100%;
        padding: 14px 18px;
        background: var(--input-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--contact-text-main);
        font-family: 'Poppins', sans-serif;
        font-size: 0.95rem;
        transition: all 0.3s;
        outline: none;
        backdrop-filter: blur(10px);
    }

    .input-group input::placeholder,
    .input-group textarea::placeholder {
        color: var(--contact-text-secondary);
        opacity: 0.7;
    }

    .input-group input:focus,
    .input-group textarea:focus {
        border-color: #007bff;
        background: rgba(0, 123, 255, 0.05);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }

    .input-group textarea {
        resize: vertical;
        min-height: 120px;
    }

    /* Bouton submit */
    .submit-btn {
        width: 100%;
        padding: 14px 28px;
        background: linear-gradient(135deg, #007bff, #00c6ff);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
        position: relative;
        overflow: hidden;
    }

    .submit-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0, 123, 255, 0.5);
    }

    .submit-btn:active:not(:disabled) {
        transform: translateY(-1px);
    }

    .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    /* Loading state */
    .submit-btn.loading::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Notifications */
    .notification {
        position: fixed;
        top: 30px;
        right: 30px;
        padding: 16px 24px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateX(400px);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 10000;
    }

    .notification.show {
        opacity: 1;
        transform: translateX(0);
    }

    .notification.success {
        background: linear-gradient(135deg, #4cd964, #34c759);
        color: white;
    }

    .notification.error {
        background: linear-gradient(135deg, #ff3b30, #ff6b6b);
        color: white;
    }

    .notification-icon {
        font-size: 1.3rem;
        font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .contact-section {
            padding: 60px 15px;
        }

        .contact-title {
            font-size: 2.2rem;
        }

        .contact-form {
            padding: 30px 25px;
        }

        .notification {
            right: 15px;
            left: 15px;
            top: 20px;
        }
    }
</style>

<section class="contact-section">
    <div class="contact-container">
        <h2 class="contact-title">Contactez-moi</h2>
        <p class="contact-subtitle">Un projet en tête ? N'hésitez pas à m'envoyer un message</p>
        
        <form id="contact-form" class="contact-form">
            <div class="input-group">
                <input type="text" name="name" placeholder="Votre nom" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Votre email" required>
            </div>
            <div class="input-group">
                <textarea name="message" rows="5" placeholder="Votre message" required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">
                <span>Envoyer le message</span>
            </button>
        </form>
    </div>
</section>

<script>
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Désactiver le bouton et afficher le loading
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        const btnText = submitBtn.querySelector('span');
        const originalText = btnText.textContent;
        btnText.textContent = 'Envoi en cours...';
        btnText.style.opacity = '0';

        // Récupérer les données du formulaire
        const formData = new FormData(form);

        try {
            const response = await fetch('https://formspree.io/f/xojqonlr', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                // Succès !
                showNotification('✓', 'Message envoyé avec succès !', 'success');
                form.reset();
            } else {
                // Erreur du serveur
                showNotification('✗', 'Oups ! Une erreur est survenue.', 'error');
            }
        } catch (error) {
            // Erreur réseau
            console.error('Error:', error);
            showNotification('✗', 'Erreur réseau. Veuillez réessayer.', 'error');
        } finally {
            // Réactiver le bouton
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            btnText.textContent = originalText;
            btnText.style.opacity = '1';
        }
    });

    function showNotification(icon, message, type) {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <span class="notification-icon">${icon}</span>
            <span>${message}</span>
        `;
        
        document.body.appendChild(notification);
        
        setTimeout(() => notification.classList.add('show'), 10);
        
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => notification.remove(), 400);
        }, 3000);
    }
</script>
