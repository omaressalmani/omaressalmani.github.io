<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    .stats-section {
        padding: 100px 20px;
        background: linear-gradient(135deg, rgba(0, 123, 255, 0.03) 0%, rgba(0, 198, 255, 0.03) 100%);
        position: relative;
        overflow: hidden;
    }

    .stats-container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    .stats-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .stats-title {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        font-style: italic;
        font-weight: 700;
        background: linear-gradient(135deg, #007bff, #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
        justify-items: center;
    }

    .stat-card {
        background: white;
        border: 2px solid rgba(0, 123, 255, 0.15);
        border-radius: 24px;
        padding: 30px 20px;
        width: 100%;
        max-width: 280px;
        text-align: center;
        position: relative;
        transition: all 0.4s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }

    /* Mode Sombre */
    [data-theme='dark'] .stat-card {
        background: #1c1c1e;
        border-color: rgba(255, 255, 255, 0.1);
    }

    .stat-card:hover {
        transform: translateY(-10px);
        border-color: #007bff;
        box-shadow: 0 15px 40px rgba(0, 123, 255, 0.2);
    }

    .stat-icon { font-size: 3rem; margin-bottom: 15px; display: block; }

    .stat-number {
        font-size: 3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #007bff, #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
    }

    .stat-label { font-weight: 600; margin-top: 10px; color: #333; }
    [data-theme='dark'] .stat-label { color: #fff; }

    .stat-description { font-size: 0.85rem; color: #666; margin-top: 5px; }
    
    .stat-badge {
        position: absolute; top: 15px; right: 15px;
        background: #ff3b30; color: white; padding: 4px 10px;
        border-radius: 20px; font-size: 0.7rem; font-weight: bold;
    }
</style>

<section class="stats-section">
    <div class="stats-container">
        <div class="stats-header">
            <h2 class="stats-title">Mon Parcours en Chiffres</h2>
            <p style="color: #666;">Résultats concrets et engagement ingénierie</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card" data-aos="fade-up">
                <div class="stat-icon">🎓</div>
                <span class="stat-number" data-target="2">0</span>
                <div class="stat-label">Diplômes d'Ingénieur</div>
                <p class="stat-description">ENSAM Rabat & UTC Compiègne</p>
            </div>

            <div class="stat-card" data-aos="fade-up">
                <div class="stat-badge">Hot</div>
                <div class="stat-icon">🏆</div>
                <span class="stat-number" data-target="9" data-suffix="+">0</span>
                <div class="stat-label">Certifications Dassault</div>
                <p class="stat-description">SolidWorks & 3DEXPERIENCE</p>
            </div>

            <div class="stat-card" data-aos="fade-up">
                <div class="stat-icon">💼</div>
                <span class="stat-number" data-target="12" data-suffix="+">0</span>
                <div class="stat-label">Projets Industriels</div>
                <p class="stat-description">Conception & prototypage</p>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const counters = document.querySelectorAll('.stat-number');
        
        const animate = (el) => {
            const target = +el.getAttribute('data-target');
            const suffix = el.getAttribute('data-suffix') || '';
            let count = 0;
            const speed = target / 100;

            const updateCount = () => {
                count += speed;
                if (count < target) {
                    el.innerText = Math.floor(count) + suffix;
                    setTimeout(updateCount, 20);
                } else {
                    el.innerText = target + suffix;
                }
            };
            updateCount();
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    animate(entry.target);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.5 });

        counters.forEach(c => observer.observe(c));
    });
</script>
