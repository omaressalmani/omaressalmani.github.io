{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
            <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
            <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's AI Assistant</strong>
          <span class="typing-status">{% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages"></div>

    <!-- Smart Prompts avec scroll horizontal -->
    <div id="chat-options-container">
      <button class="scroll-btn scroll-left" onclick="scrollOptions('left')" style="display:none;">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div id="chat-options-scroll">
        <div id="chat-options">
          <button onclick="botAnswer('projects')">🚀 {% if is_fr %}Projets{% else %}Projects{% endif %}</button>
          <button onclick="botAnswer('cv')">📄 {% if is_fr %}CV{% else %}Resume{% endif %}</button>
          <button onclick="botAnswer('skills')">💡 {% if is_fr %}Compétences{% else %}Skills{% endif %}</button>
          <button onclick="botAnswer('experience')">🏢 {% if is_fr %}Expérience{% else %}Experience{% endif %}</button>
          <button onclick="botAnswer('formation')">🎓 {% if is_fr %}Formation{% else %}Education{% endif %}</button>
          <button onclick="botAnswer('contact_menu')">📱 Contact</button>
        </div>
      </div>
      <button class="scroll-btn scroll-right" onclick="scrollOptions('right')">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Zone de saisie -->
    <div id="chat-input-container">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="{% if is_fr %}Posez votre question...{% else %}Ask your question...{% endif %}"
        onkeypress="handleKeyPress(event)"
      >
      <button id="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>


  </div>
</div>

<style>
  /* --- POSITIONNEMENT ET STRUCTURE --- */
  #chat-wrapper { 
    position: fixed; 
    bottom: 30px; 
    left: 30px; /* Déplacé à gauche */
    z-index: 10000; 
  }

  #chat-open-btn { 
    width: 60px; 
    height: 60px; 
    border-radius: 50%; 
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; 
    border: none; 
    cursor: pointer; 
    box-shadow: 0 8px 25px rgba(0,123,255,0.4); 
    font-size: 24px; 
    position: relative; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #chat-open-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 30px rgba(0,123,255,0.6);
  }

  /* Animation du robot */
  #chat-open-btn i {
    display: inline-block;
    animation: robot-wiggle 4s infinite;
  }

  @keyframes robot-wiggle {
    0%, 90% { transform: rotate(0deg); }
    92% { transform: rotate(15deg); }
    95% { transform: rotate(-15deg); }
    97% { transform: rotate(15deg); }
    100% { transform: rotate(0deg); }
  }

  .notification-badge {
    position: absolute; top: -2px; right: -2px; background: #ff3b30; color: white;
    font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 2px solid white; font-weight: bold;
    animation: pulse-badge 2s infinite;
  }

  @keyframes pulse-badge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* Fenêtre de chat - Adapté pour mode sombre */
  #chat-container { 
    width: 360px; 
    height: 600px; 
    max-height: 85vh;
    background: var(--global-bg-color, #ffffff);
    border: 1px solid var(--global-divider-color, rgba(0,0,0,0.1)); 
    border-radius: 24px;

  #chat-container.chat-hidden {

  }

  /* Header - Adapté pour mode sombre */

    color: white;

  .avatar-wrapper { position: relative; }
  .online-indicator {

    bottom: 2px; 
    right: 2px; 
    width: 12px; 
    height: 12px; 
    background: #4cd964; 
    border-radius: 50%; 
    border: 2px solid #007bff;
    animation: pulse-online 2s infinite;
  }

  @keyframes pulse-online {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .bot-profile img { 
    width: 42px; 
    height: 42px; 
    border-radius: 50%; 
    object-fit: cover; 
    background: white;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .bot-details strong { font-size: 0.95rem; display: block; }
  .typing-status { font-size: 11px; opacity: 0.9; }
  .close-chat-btn { 
    background: none; 
    border: none; 
    color: white; 
    font-size: 26px; 
    cursor: pointer;
    transition: transform 0.2s;
  }
  .close-chat-btn:hover { transform: rotate(90deg); }

  /* Messages - Adapté pour mode sombre */
  #chat-messages { 
    flex: 1; 
    padding: 20px; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    scroll-behavior: smooth;
    background: var(--global-bg-color, #ffffff);
  }

  #chat-messages::-webkit-scrollbar { width: 6px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { 
    background: var(--global-divider-color, #ccc);

  }

  .message {

  .bot-msg {

    background: linear-gradient(135deg, #007bff, #0056b3);

    box-shadow: 0 2px 5px rgba(0,123,255,0.3);

  /* Container des options avec scroll horizontal */
  #chat-options-container {
    position: relative;
    border-top: 1px solid var(--global-divider-color, rgba(0,0,0,0.05));
    background: var(--global-bg-color, #ffffff);

  #chat-options-scroll {

  /* Barre de scroll style navigateur pour desktop */

  }

    background: var(--global-code-bg-color, #f5f5f5);
  }

    background: var(--global-divider-color, #ccc);

  }

    background: #999;
  }

  #chat-options { 
    padding: 12px 15px;

  #chat-options button { 
    background: var(--global-bg-color, #ffffff);
    border: 1.5px solid #007bff;

  /* Boutons de scroll */
  .scroll-btn {

    background: #007bff;
    color: white;

  }

  .scroll-left { left: 5px; }
  .scroll-right { right: 5px; }

  /* Zone de saisie */
  #chat-input-container {
    display: flex;
    gap: 10px;

    background: var(--global-bg-color, #ffffff);
    border-top: 1px solid var(--global-divider-color, rgba(0,0,0,0.05));

  #chat-input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--global-divider-color, #ddd);

    font-size: 0.9rem;

  }

  #chat-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
  }

  #send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #007bff, #0056b3);
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 16px;
  }

  #send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 4px 12px rgba(0,123,255,0.4);
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: scale(1);
  }

  /* Grille de contact */
  .contact-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 10px; 
    margin-top: 10px; 
    width: 100%; 
  }

  .contact-btn { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px; 
    padding: 12px; 
    border-radius: 12px; 
    color: white !important; 
    font-size: 0.8rem; 
    font-weight: 600; 
    text-decoration: none !important; 
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .contact-btn:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }



  /* Liste de compétences/infos */
  .info-list {
    background: var(--global-code-bg-color, #f8f9fa);
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
    width: 100%;
  }

  .info-list-item {
    padding: 8px;
    margin: 4px 0;
    background: var(--global-bg-color, #ffffff);
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--global-text-color, #333);
    border-left: 3px solid #007bff;
  }

  /* Responsive Mobile */
  @media (max-width: 576px) {
    #chat-container { 
      width: calc(100vw - 40px);
      max-width: 340px;
      height: 550px; 
      bottom: 75px; 
      left: 0;
    }
    
    #chat-container.chat-hidden {
      transform: scale(0.7) translateY(100px);
    }
    
    #chat-wrapper { 
      bottom: 20px; 
      left: 20px;
    }

    .scroll-btn { display: none !important; }
  }

  /* Ajustement marge PC pour rester dans la zone de contenu */
  @media (min-width: 577px) and (max-width: 1200px) {
    #chat-wrapper {
      left: 20px;
    }
  }

  @media (min-width: 1201px) {
    #chat-wrapper {
      left: max(30px, calc((100vw - 1200px) / 2 + 20px));
    }
  }

  @keyframes fadeInChat { 
    from { opacity: 0; transform: translateY(15px); } 
    to { opacity: 1; transform: translateY(0); } 
  }

  /* Animation de typing */
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    align-self: flex-start;
  }

  .typing-indicator span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #007bff;
    animation: typing 1.4s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
    30% { transform: translateY(-10px); opacity: 1; }
  }
</style>

  // Historique de conversation pour l'IA
  let conversationHistory = [];

  // Gestion du scroll horizontal
  function scrollOptions(direction) {
    const container = document.getElementById('chat-options-scroll');

    if (container.scrollLeft <= 0) {

 // Au début de votre script, remplacez la section "Ouverture automatique" par ceci :

// Variables de détection de page
const isAboutPage = window.location.pathname.includes('/about');

// Ouverture automatique UNIQUEMENT sur les pages about
window.addEventListener('load', () => {
  // Vérifier si on est sur une page about
  if (isAboutPage) {
    setTimeout(() => {
      const chat = document.getElementById('chat-container');
      if (chat && chat.classList.contains('chat-hidden')) {
        toggleChat();
        setTimeout(() => {
            sendBotMessage(isFrench ? "Salut ! Je suis l'assistant virtuel d'Omar. 👋" : "Hi! I'm Omar's virtual assistant. 👋");
            setTimeout(() => {
                sendBotMessage(isFrench ? 
                  "Vous pouvez me poser n'importe quelle question sur son parcours, ses compétences ou ses projets !" : 
                  "You can ask me any question about his background, skills or projects!");
            }, 1200);
        }, 500);
      }
    }, 2500);
  }
  
  // Toujours initialiser les boutons de scroll
  const optionsScroll = document.getElementById('chat-options-scroll');
  if (optionsScroll) {
    updateScrollButtons();
    optionsScroll.addEventListener('scroll', updateScrollButtons);
  }
});
  function toggleChat() {
    const chat = document.getElementById('chat-container');
    chat.classList.toggle('chat-hidden');
    document.querySelector('.notification-badge').style.display = 'none';
    if (!chat.classList.contains('chat-hidden')) {
      updateScrollButtons();
      document.getElementById('chat-input').focus();
    }
  }

  function sendBotMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    chatMessages.appendChild(bMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendUserMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    chatMessages.appendChild(uMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    const chatMessages = document.getElementById('chat-messages');
    const typing = document.createElement('div');
    typing.className = "typing-indicator";
    typing.id = "typing";
    typing.innerHTML = '<span></span><span></span><span></span>';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
  }

  // Gestion de l'envoi de message
  function handleKeyPress(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    
    if (!message) return;
    
    // Afficher le message de l'utilisateur
    sendUserMessage(message);
    input.value = '';
    
    // Désactiver le bouton pendant le traitement
    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;
    
    // Afficher l'indicateur de typing
    showTyping();
    
    // Ajouter à l'historique
    conversationHistory.push({
      role: "user",
      content: message
    });
    
    try {
      // Appeler l'API Claude
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: `Tu es l'assistant virtuel d'Omar ESSALMANI sur son portfolio. Tu réponds aux questions des visiteurs en te basant UNIQUEMENT sur les informations suivantes :

${JSON.stringify(omarData, null, 2)}

Instructions importantes :
- Réponds en ${isFrench ? 'français' : 'anglais'}
- Sois concis et professionnel
- Si on te pose une question sur quelque chose qui n'est pas dans les données d'Omar, dis que tu n'as pas cette information et suggère de le contacter directement
- Utilise des émojis appropriés pour rendre les réponses plus engageantes
- Ne parle QUE d'Omar et de son parcours professionnel
- Si on te demande des compétences spécifiques ou des expériences, cite les données exactes
- Pour les questions de contact, propose les liens sociaux disponibles`,
          messages: conversationHistory
        })
      });

      const data = await response.json();
      hideTyping();
      
      if (data.content && data.content[0]) {
        const botResponse = data.content[0].text;
        
        // Ajouter la réponse à l'historique
        conversationHistory.push({
          role: "assistant",
          content: botResponse
        });
        
        sendBotMessage(botResponse);
      } else {
        throw new Error("Pas de réponse");
      }
      
    } catch (error) {
      hideTyping();
      console.error("Erreur:", error);
      sendBotMessage(isFrench ? 
        "Désolé, je rencontre un problème technique. Vous pouvez utiliser les boutons ci-dessous pour naviguer ! 😊" :
        "Sorry, I'm experiencing a technical issue. You can use the buttons below to navigate! 😊");
    } finally {
      sendBtn.disabled = false;
    }
  }

    else if (type === 'experience') {

    else if (type === 'formation') {
      sendUserMessage(isFrench ? "Formation" : "Education");

        hideTyping();
        sendBotMessage(isFrench ? 
          "🎓 <strong>UTC Compiègne</strong> (2023-2025)<br>Diplôme Ingénieur - Conception Mécanique Intégrée" :
          "🎓 <strong>UTC Compiègne</strong> (2023-2025)<br>Engineering Degree - Integrated Mechanical Design");
        setTimeout(() => {
          sendBotMessage(isFrench ? 
            "🎓 <strong>ENSAM Rabat</strong> (2021-2024)<br>Diplôme Ingénieur d'État - Génie Mécanique (1er/47)" :
            "🎓 <strong>ENSAM Rabat</strong> (2021-2024)<br>State Engineering Degree - Mechanical Engineering (1st/47)");

    else if (type === 'contact_menu') {

      }, 800);

  function injectSkillsList() {
    const chatMessages = document.getElementById('chat-messages');
    const list = document.createElement('div');
    list.className = "info-list";
    list.innerHTML = `
      <div class="info-list-item">🔧 CAO/XAO: CATIA V5, SolidWorks, Creo, 3DExperience</div>
      <div class="info-list-item">📐 Calcul: Ansys, Abaqus, FEA, RDM</div>
      <div class="info-list-item">⚙️ Normes: IEC 60601, ISO 13485, Eurocodes</div>
      <div class="info-list-item">💬 Langues: Français (Bilingue), Anglais (Courant)</div>
    `;
    chatMessages.appendChild(list);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function injectContactGrid() {
    const chatMessages = document.getElementById('chat-messages');
    const grid = document.createElement('div');
    grid.className = "contact-grid";
    grid.innerHTML = `
      <a href="${socialLinks.linkedin}" target="_blank" class="contact-btn" style="background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="${socialLinks.email}" class="contact-btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email</a>
      <a href="${socialLinks.github}" target="_blank" class="contact-btn" style="background:#333;"><i class="fa-brands fa-github"></i> GitHub</a>
      <a href="${socialLinks.instagram}" target="_blank" class="contact-btn" style="background:#e4405f;"><i class="fa-brands fa-instagram"></i> Instagram</a>
    `;
    chatMessages.appendChild(grid);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
