{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}
  {% assign is_fr = true %}
{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <!-- HEADER -->
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
          <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}">
          <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's AI Assistant</strong>
          <span class="typing-status">
            {% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}
          </span>
        </div>
      </div>

      <div class="chat-header-actions">
        <button class="clear-chat-btn" onclick="clearChat()" title="Clear">
          <i class="fa-solid fa-trash"></i>
        </button>
        <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div id="chat-messages"></div>

    <!-- INPUT -->
    <div id="chat-input-container">
      <input id="chat-input"
             type="text"
             placeholder="{% if is_fr %}Posez votre question...{% else %}Ask your question...{% endif %}"
             onkeypress="handleKeyPress(event)">
      <button id="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>

    <!-- FOOTER -->
    <div id="chat-footer">
      {% if is_fr %}Développé par{% else %}Developed by{% endif %}
      <strong>Omar ESSALMANI</strong>
    </div>
  </div>
</div>

<style>
/* ================= FIX OVERFLOW PC ================= */
#chat-wrapper {
  position: fixed;
  bottom: 30px;
  left: 30px;
  max-width: calc(100vw - 60px);
  z-index: 10000;
}

#chat-container {
  width: 360px;
  max-width: calc(100vw - 40px);
  height: 600px;
  max-height: 85vh;
  background: #fff;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  position: absolute;
  bottom: 80px;
  left: 0;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.chat-hidden {
  opacity: 0;
  visibility: hidden;
  transform: scale(0.7) translateY(100px);
}

/* ================= HEADER ================= */
#chat-header {
  background: linear-gradient(135deg,#007bff,#0056b3);
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header-actions {
  display: flex;
  gap: 10px;
}

.clear-chat-btn,
.close-chat-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
}

.clear-chat-btn:hover,
.close-chat-btn:hover {
  background: rgba(255,255,255,0.35);
}

/* ================= MESSAGES ================= */
#chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  padding: 12px 16px;
  border-radius: 18px;
  margin-bottom: 10px;
  max-width: 85%;
}

.bot-msg {
  background: #f1f1f1;
  align-self: flex-start;
}

.user-msg {
  background: #007bff;
  color: white;
  align-self: flex-end;
}

/* ================= INPUT ================= */
#chat-input-container {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #eee;
}

#chat-input {
  flex: 1;
  padding: 10px 15px;
  border-radius: 25px;
  border: 1px solid #ddd;
}

#send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #007bff;
  color: white;
  cursor: pointer;
}

/* ================= FOOTER ================= */
#chat-footer {
  text-align: center;
  padding: 10px;
  font-size: 12px;
  background: #f8f9fa;
}

/* ================= MOBILE ================= */
@media (max-width: 576px) {
  #chat-container {
    width: calc(100vw - 40px);
    height: 550px;
  }
}
</style>

<script>
const isFrench = {{ is_fr }};
let conversationHistory = [];

function toggleChat() {
  document.getElementById('chat-container').classList.toggle('chat-hidden');
  document.querySelector('.notification-badge').style.display = 'none';
}

function sendBotMessage(text) {
  const div = document.createElement('div');
  div.className = 'message bot-msg';
  div.innerHTML = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'message user-msg';
  div.innerText = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function handleKeyPress(e) {
  if (e.key === 'Enter') sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  if (!input.value.trim()) return;

  sendUserMessage(input.value);
  conversationHistory.push({ role: "user", content: input.value });
  input.value = '';

  sendBotMessage(isFrench ? "⏳ Réflexion..." : "⏳ Thinking...");
}

function clearChat() {
  document.getElementById('chat-messages').innerHTML = '';
  conversationHistory = [];
  setTimeout(() => {
    sendBotMessage(
      isFrench
        ? "🧹 Historique effacé !"
        : "🧹 Chat history cleared!"
    );
  }, 300);
}
</script>
