{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
            <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
            <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's AI Assistant</strong>
          <span class="typing-status">{% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages">
      </div>

    <div id="chat-options">
      <button onclick="botAnswer('projects')">🚀 {% if is_fr %}Projets{% else %}Projects{% endif %}</button>
      <button onclick="botAnswer('cv')">📄 {% if is_fr %}Mon CV{% else %}Resume{% endif %}</button>
      <button onclick="botAnswer('contact_menu')">📱 Contact</button>
    </div>
  </div>
</div>

<style>
  /* --- POSITIONNEMENT ET STRUCTURE --- */
  #chat-wrapper { 
    position: fixed; 
    bottom: 30px; 
    right: 30px; 
    z-index: 10000; 
  }

  #chat-open-btn { 
    width: 60px; 
    height: 60px; 
    border-radius: 50%; 
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; 
    border: none; 
    cursor: pointer; 
    box-shadow: 0 8px 25px rgba(0,123,255,0.4); 
    font-size: 24px; 
    position: relative; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Bonus: Animation du petit robot */
  #chat-open-btn i {
    display: inline-block;
    animation: robot-wiggle 4s infinite;
  }

  @keyframes robot-wiggle {
    0%, 90% { transform: rotate(0deg); }
    92% { transform: rotate(15deg); }
    95% { transform: rotate(-15deg); }
    97% { transform: rotate(15deg); }
    100% { transform: rotate(0deg); }
  }

  .notification-badge {
    position: absolute; top: -2px; right: -2px; background: #ff3b30; color: white;
    font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 2px solid white; font-weight: bold;
  }

  /* Fenêtre de chat avec correction PC (max-height) */
  #chat-container { 
    width: 350px; 
    height: 500px; 
    max-height: 80vh; /* Empêche l'entête de sortir de l'écran sur PC */
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px); 
    border: 1px solid rgba(0,0,0,0.1); 
    border-radius: 24px; 
    display: flex; 
    flex-direction: column; 
    box-shadow: 0 15px 50px rgba(0,0,0,0.15); 
    position: absolute; 
    bottom: 80px; 
    right: 0; 
    overflow: hidden; 
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: bottom right;
  }
  
  [data-theme='dark'] #chat-container { background: rgba(28, 28, 30, 0.98); border-color: rgba(255,255,255,0.1); }
  #chat-container.chat-hidden { visibility: hidden; opacity: 0; transform: scale(0.7) translateY(100px); }

  /* Header */
  #chat-header { background: #007bff; color: white; padding: 18px 15px; display: flex; align-items: center; justify-content: space-between; }
  .bot-profile { display: flex; align-items: center; gap: 12px; }
  .avatar-wrapper { position: relative; }
  .online-indicator { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #4cd964; border-radius: 50%; border: 2px solid #007bff; }
  .bot-profile img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: white; }
  .bot-details strong { font-size: 0.95rem; display: block; }
  .typing-status { font-size: 11px; opacity: 0.9; }
  .close-chat-btn { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }

  /* Messages */
  #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .message { padding: 12px 16px; border-radius: 20px; font-size: 0.92rem; max-width: 85%; animation: fadeInChat 0.4s ease forwards; line-height: 1.4; }
  .bot-msg { background: #f0f0f2; color: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; }
  [data-theme='dark'] .bot-msg { background: #2c2c2e; color: #f2f2f7; }
  .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  /* Options */
  #chat-options { padding: 15px; display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid rgba(0,0,0,0.05); }
  #chat-options button { 
    background: var(--global-bg-color); border: 1.5px solid #007bff; color: #007bff; 
    padding: 8px 16px; border-radius: 25px; font-size: 0.85rem; cursor: pointer; 
    transition: 0.2s; font-weight: 600;
  }
  #chat-options button:hover { background: #007bff; color: white; transform: translateY(-2px); }

  /* Grille de contact */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; width: 100%; }
  .contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; color: white !important; font-size: 0.8rem; font-weight: 600; text-decoration: none !important; transition: 0.3s; }
  .contact-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

  /* Responsive Mobile */
  @media (max-width: 576px) {
    #chat-container { width: 300px; height: 450px; bottom: 75px; right: -10px; }
    #chat-wrapper { bottom: 20px; right: 20px; }
  }

  @keyframes fadeInChat { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
  const isFrench = {{ is_fr }};
  const socialLinks = {
    linkedin: "https://www.linkedin.com/in/omar-essalmani",
    email: "mailto:omaressalmani0@gmail.com",
    github: "https://github.com/omaressalmani",
    instagram: "https://www.instagram.com/essalmaniomar"
  };

  // Ouverture automatique proactive
  window.addEventListener('load', () => {
    setTimeout(() => {
      const chat = document.getElementById('chat-container');
      if (chat.classList.contains('chat-hidden')) {
        toggleChat();
        setTimeout(() => {
            sendBotMessage(isFrench ? "Salut ! Je suis l'assistant d'Omar. 👋" : "Hi! I'm Omar's assistant. 👋");
            setTimeout(() => {
                sendBotMessage(isFrench ? "Je peux vous aider à parcourir mes projets ou à me contacter directement !" : "I can help you browse my projects or contact me directly!");
            }, 1000);
        }, 500);
      }
    }, 2500);
  });

  function toggleChat() {
    const chat = document.getElementById('chat-container');
    chat.classList.toggle('chat-hidden');
    document.querySelector('.notification-badge').style.display = 'none';
  }

  function sendBotMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    chatMessages.appendChild(bMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendUserMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    chatMessages.appendChild(uMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function botAnswer(type) {
    if (type === 'projects') {
      sendUserMessage(isFrench ? "Voir les projets" : "See projects");
      setTimeout(() => {
        sendBotMessage(isFrench ? "Direction la galerie des projets..." : "Taking you to the projects gallery...");
        setTimeout(() => window.location.href = isFrench ? "{{ '/fr/projects/' | relative_url }}" : "{{ '/projects/' | relative_url }}", 1200);
      }, 600);
    } 
    else if (type === 'cv') {
      sendUserMessage(isFrench ? "Consulter le CV" : "View Resume");
      setTimeout(() => {
        sendBotMessage(isFrench ? "Voici mon parcours d'ingénieur." : "Opening my engineering background.");
        setTimeout(() => window.location.href = isFrench ? "{{ '/fr/cv/' | relative_url }}" : "{{ '/cv/' | relative_url }}", 1200);
      }, 600);
    } 
    else if (type === 'contact_menu') {
      sendUserMessage("Contact");
      setTimeout(() => {
        sendBotMessage(isFrench ? "Où préférez-vous me joindre ?" : "Where would you like to connect?");
        injectContactGrid();
      }, 600);
    }
  }

  function injectContactGrid() {
    const chatMessages = document.getElementById('chat-messages');
    const grid = document.createElement('div');
    grid.className = "contact-grid";
    grid.innerHTML = `
      <a href="${socialLinks.linkedin}" target="_blank" class="contact-btn" style="background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="${socialLinks.email}" class="contact-btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email</a>
      <a href="${socialLinks.github}" target="_blank" class="contact-btn" style="background:#333;"><i class="fa-brands fa-github"></i> GitHub</a>
      <a href="${socialLinks.instagram}" target="_blank" class="contact-btn" style="background:#e4405f;"><i class="fa-brands fa-instagram"></i> Instagram</a>
    `;
    chatMessages.appendChild(grid);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
