{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
            <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
            <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's Tech Assistant</strong>
          <span class="typing-status">{% if is_fr %}IA Ingénierie active{% else %}Engineering AI active{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages">
        </div>

    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="{% if is_fr %}Posez une question technique...{% else %}Ask a technical question...{% endif %}" onkeypress="handleKeyPress(event)">
      <button onclick="processInput()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <div id="chat-options">
      <button onclick="botAnswer('projects')">🚀 Projets</button>
      <button onclick="botAnswer('cv')">📄 CV</button>
      <button onclick="botAnswer('contact_menu')">📱 Contact</button>
    </div>
  </div>
</div>

<style>
  /* --- STRUCTURE ET POSITIONNEMENT --- */
  #chat-wrapper { 
    position: fixed; 
    bottom: 30px; 
    right: 100px; /* Décalé pour laisser la place au bouton remonter */
    z-index: 10001; 
  }

  #chat-open-btn { 
    width: 60px; height: 60px; border-radius: 50%; 
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; border: none; cursor: pointer; 
    box-shadow: 0 8px 25px rgba(0,123,255,0.4); 
    font-size: 24px; position: relative; transition: 0.3s;
  }

  #chat-open-btn i { display: inline-block; animation: robot-wiggle 4s infinite; }
  @keyframes robot-wiggle { 0%, 90% { transform: rotate(0deg); } 92% { transform: rotate(15deg); } 95% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

  .notification-badge {
    position: absolute; top: -2px; right: -2px; background: #ff3b30; color: white;
    font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 2px solid white; font-weight: bold;
  }

  #chat-container { 
    width: 350px; height: 550px; max-height: 80vh; 
    background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); 
    border: 1px solid rgba(0,0,0,0.1); border-radius: 24px; 
    display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.15); 
    position: absolute; bottom: 80px; right: 0; overflow: hidden; 
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: bottom right;
  }
  
  [data-theme='dark'] #chat-container { background: rgba(28, 28, 30, 0.98); border-color: rgba(255,255,255,0.1); color: white; }
  #chat-container.chat-hidden { visibility: hidden; opacity: 0; transform: scale(0.7) translateY(100px); }

  #chat-header { background: #007bff; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
  .bot-profile { display: flex; align-items: center; gap: 10px; }
  .bot-profile img { width: 40px; height: 40px; border-radius: 50%; background: white; object-fit: cover; }
  .online-indicator { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: #4cd964; border-radius: 50%; border: 2px solid #007bff; }
  .close-chat-btn { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }

  #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .message { padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; max-width: 85%; line-height: 1.4; animation: fadeIn 0.3s; }
  .bot-msg { background: #f0f0f2; align-self: flex-start; color: #1c1c1e; border-bottom-left-radius: 4px; }
  [data-theme='dark'] .bot-msg { background: #3a3a3c; color: #f2f2f7; }
  .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  #chat-input-area { display: flex; padding: 12px; border-top: 1px solid rgba(0,0,0,0.05); background: var(--global-bg-color); }
  #chat-input-area input { flex: 1; border: none; padding: 10px 15px; border-radius: 20px; background: #f0f0f2; font-size: 0.85rem; outline: none; }
  [data-theme='dark'] #chat-input-area input { background: #2c2c2e; color: white; }
  #chat-input-area button { background: none; border: none; color: #007bff; margin-left: 10px; cursor: pointer; font-size: 1.1rem; }

  #chat-options { padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border-top: 1px solid rgba(0,0,0,0.05); }
  #chat-options button { background: var(--global-bg-color); border: 1.5px solid #007bff; color: #007bff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-weight: 600; transition: 0.2s; }
  #chat-options button:hover { background: #007bff; color: white; }

  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; width: 100%; }
  .contact-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px; border-radius: 10px; color: white !important; font-size: 0.75rem; font-weight: 600; text-decoration: none !important; }

  @media (max-width: 576px) {
    #chat-wrapper { right: 80px; bottom: 20px; }
    #chat-container { width: 280px; right: -20px; }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
  const isFrench = {{ is_fr }};
  const socialLinks = { 
    linkedin: "https://www.linkedin.com/in/omar-essalmani", 
    email: "mailto:omaressalmani0@gmail.com",
    github: "https://github.com/omaressalmani",
    instagram: "https://www.instagram.com/essalmaniomar"
  };

  [cite_start]// BASE DE CONNAISSANCES EXTRAITE DE TON CV [cite: 1, 37, 40]
  const techKnowledge = {
    "ensam": isFrench ? "Omar est ingénieur ENSAM (Major de promotion 1er/47). Il y a acquis ses bases solides en génie mécanique." : "Omar is an ENSAM Engineer (ranked 1st/47). He gained strong mechanical engineering foundations there.",
    "utc": isFrench ? "Il complète son profil à l'UTC avec une spécialisation en Conception Mécanique Intégrée." : "He completes his profile at UTC with a specialization in Integrated Mechanical Design.",
    "solidworks": isFrench ? "Expert SolidWorks, il l'utilise pour la CAO, le FEA et le design for manufacturing, notamment chez Guerbet." : "SolidWorks expert, he uses it for CAD, FEA, and design for manufacturing, notably at Guerbet.",
    "creo": isFrench ? "Il a utilisé Creo 7.0 pour la conception d'un fauteuil roulant modulaire avec Windchill PDMlink." : "He used Creo 7.0 for designing a modular wheelchair with Windchill PDMlink.",
    "médical": isFrench ? "Spécialisé en dispositifs médicaux (Guerbet, Metec), il maîtrise les normes ISO 13485 et IEC 60601." : "Specialized in medical devices (Guerbet, Metec), he masters ISO 13485 and IEC 60601 standards.",
    "catia": isFrench ? "Maîtrise de CATIA V5 pour le surfaçage et la conception de systèmes comme des prothèses de bras." : "Proficient in CATIA V5 for surfacing and designing systems like prosthetic arms.",
    "ansys": isFrench ? "Utilisé pour valider des choix de conception par simulation numérique (ex: palettiseur cartésien)." : "Used to validate design choices through numerical simulation (e.g., Cartesian palletizer).",
    "abaqus": "Utilisé pour les calculs FEA complexes et la simulation de structures mécaniques.",
    "python": "Omar utilise Python et VBA pour automatiser les calculs d'ingénierie et le traitement de données.",
    "stage": isFrench ? "Il a effectué des stages marquants chez Guerbet (PFE), Cornilleau et OGE. Il recherche un CDI." : "He completed impactful internships at Guerbet (PFE), Cornilleau, and OGE. He is seeking a CDI.",
    "disponible": isFrench ? "Omar est disponible immédiatement pour un poste en France (Titre APS)." : "Omar is available immediately for a position in France."
  };

  window.addEventListener('load', () => {
    setTimeout(() => {
      const chat = document.getElementById('chat-container');
      if (chat.classList.contains('chat-hidden')) {
        toggleChat();
        setTimeout(() => {
            sendBotMessage(isFrench ? "Salut ! Je suis l'assistant intelligent d'Omar. 👋" : "Hi! I'm Omar's smart assistant. 👋");
            sendBotMessage(isFrench ? "Posez-moi une question sur ses compétences (ex: SolidWorks, ENSAM, Médical...)" : "Ask me about his skills (e.g., SolidWorks, ENSAM, Medical...)");
        }, 800);
      }
    }, 2500);
  });

  function toggleChat() {
    document.getElementById('chat-container').classList.toggle('chat-hidden');
    document.querySelector('.notification-badge').style.display = 'none';
  }

  function handleKeyPress(e) { if (e.key === 'Enter') processInput(); }

  function processInput() {
    const input = document.getElementById('user-input');
    const text = input.value.trim().toLowerCase();
    if (!text) return;

    sendUserMessage(input.value);
    input.value = "";

    setTimeout(() => {
        let found = false;
        for (let key in techKnowledge) {
            if (text.includes(key)) {
                sendBotMessage(techKnowledge[key]);
                found = true; break;
            }
        }
        if (!found) {
            sendBotMessage(isFrench ? "Je ne suis pas sûr pour ce point précis, mais vous pouvez consulter ses projets ou le contacter !" : "I'm not sure about that, but feel free to check his projects or contact him!");
        }
    }, 600);
  }

  function sendBotMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    chatMessages.appendChild(bMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendUserMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    chatMessages.appendChild(uMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function botAnswer(type) {
    if (type === 'projects') {
      sendUserMessage(isFrench ? "Voir les projets" : "See projects");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/projects/' | relative_url }}" : "{{ '/projects/' | relative_url }}", 1000);
    } 
    else if (type === 'cv') {
      sendUserMessage(isFrench ? "Ouvrir le CV" : "Open CV");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/cv/' | relative_url }}" : "{{ '/cv/' | relative_url }}", 1000);
    }
    else if (type === 'contact_menu') {
      sendBotMessage(isFrench ? "Voici comment joindre Omar :" : "Here is how to reach Omar:");
      injectContactGrid();
    }
  }

  function injectContactGrid() {
    const chatMessages = document.getElementById('chat-messages');
    const grid = document.createElement('div');
    grid.className = "contact-grid";
    grid.innerHTML = `
      <a href="${socialLinks.linkedin}" target="_blank" class="contact-btn" style="background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="${socialLinks.email}" class="contact-btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email</a>
      <a href="${socialLinks.github}" target="_blank" class="contact-btn" style="background:#333;"><i class="fa-brands fa-github"></i> GitHub</a>
      <a href="${socialLinks.instagram}" target="_blank" class="contact-btn" style="background:#e4405f;"><i class="fa-brands fa-instagram"></i> Instagram</a>
    `;
    chatMessages.appendChild(grid);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
