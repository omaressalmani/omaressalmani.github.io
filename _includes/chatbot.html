<script type="text/javascript">
  (function(){
    d=document;
    s=d.createElement("script");
    s.src="https://sitespeak.ai/chatbots/3b45485a-f01d-4b59-80c3-a1513617088b.js";
    s.async=1;
    d.getElementsByTagName("head")[0].appendChild(s);
  })();
</script>

<style>
  /* Décalage global pour laisser la place au bouton "Back to Top" */
  #sitespeakai-chat-button, 
  [id^="sitespeakai-widget"] {
    right: 180px !important;
    bottom: 30px !important;
    z-index: 999999 !important;
  }

  /* Cache le logo et la mention Powered By SiteSpeakAI */
  .sitespeakai-powered-by,
  div[class*="PoweredBy"],
  a[href*="sitespeak.ai"] {
    display: none !important;
    opacity: 0 !important;
    height: 0 !important;
    pointer-events: none !important;
  }

  /* Tente d'injecter la couleur bleue de ton site (#007bff) */
  #sitespeakai-chat-window header {
    background: linear-gradient(135deg, #007bff, #00c6ff) !important;
  }

  @media (max-width: 576px) {
    #sitespeakai-chat-button { right: 100px !important; }
  }
</style>

<script>
  window.addEventListener('load', function() {
    // Changement dynamique du titre "omaar" -> "Omar's Tech Assistant!"
    const renameAssistant = setInterval(function() {
      const elements = document.querySelectorAll('*:not(script):not(style)');
      elements.forEach(el => {
        if (el.children.length === 0 && el.innerText.includes('omaar')) {
          el.innerText = el.innerText.replace('omaar', "Omar's Tech Assistant!");
        }
      });
    }, 500);

    // Stop après 10s
    setTimeout(() => clearInterval(renameAssistant), 10000);

    // Ouverture auto après 3 secondes
    setTimeout(function() {
      const btn = document.getElementById('sitespeakai-chat-button') || document.querySelector('.sitespeakai-chat-button');
      if (btn) btn.click();
    }, 3000);
  });
</script>
