{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
            <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
            <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's Tech Assistant</strong>
          <span class="typing-status">{% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-options-container">
      <div id="chat-options-scroll">
        <button onclick="botAnswer('projects')">🚀 {% if is_fr %}Projets{% else %}Projects{% endif %}</button>
        <button onclick="botAnswer('cv')">📄 {% if is_fr %}Mon CV{% else %}Resume{% endif %}</button>
        <button onclick="botAnswer('contact_menu')">📱 Contact</button>
        <button onclick="botAnswer('skills')">🛠️ {% if is_fr %}Compétences{% else %}Skills{% endif %}</button>
        <button onclick="botAnswer('location')">📍 {% if is_fr %}Mobilité{% else %}Location{% endif %}</button>
      </div>
    </div>

    <div id="chat-footer">
      <span>Developed by <strong>Omar ESSALMANI</strong></span>
    </div>
  </div>
</div>

<style>
  /* --- POSITIONNEMENT --- */
  #chat-wrapper { position: fixed; bottom: 30px; right: 110px; z-index: 10000; }
  #chat-open-btn { 
    width: 60px; height: 60px; border-radius: 50%; 
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; border: none; cursor: pointer; 
    box-shadow: 0 8px 25px rgba(0,123,255,0.4); font-size: 24px;
  }
  #chat-open-btn i { display: inline-block; animation: robot-wiggle 4s infinite; }
  @keyframes robot-wiggle { 0%, 90% { transform: rotate(0deg); } 92% { transform: rotate(15deg); } 95% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

  /* --- CONTENEUR DYNAMIQUE (DARK/LIGHT) --- */
  #chat-container { 
    width: 350px; height: 530px; max-height: 80vh;
    background: var(--global-bg-color, #ffffff);
    border: 1px solid var(--global-divider-color, rgba(0,0,0,0.1)); 
    border-radius: 24px; display: flex; flex-direction: column; 
    box-shadow: 0 15px 50px rgba(0,0,0,0.15); position: absolute; bottom: 80px; right: 0; 
    overflow: hidden; transition: all 0.4s ease; transform-origin: bottom right;
  }
  #chat-container.chat-hidden { visibility: hidden; opacity: 0; transform: scale(0.7) translateY(100px); }

  #chat-header { background: #007bff; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
  .bot-profile { display: flex; align-items: center; gap: 10px; }
  .bot-profile img { width: 40px; height: 40px; border-radius: 50%; background: white; object-fit: cover; }
  .online-indicator { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: #4cd964; border-radius: 50%; border: 2px solid #007bff; }

  #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .message { padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; max-width: 85%; line-height: 1.4; }
  .bot-msg { background: var(--global-card-bg-color, #f0f0f2); color: var(--global-text-color); align-self: flex-start; }
  .user-msg { background: #007bff; color: white; align-self: flex-end; }

  /* --- SMART PROMPTS AVEC SCROLLBAR PC --- */
  #chat-options-container { border-top: 1px solid var(--global-divider-color); padding: 10px 0; }
  #chat-options-scroll {
    display: flex; overflow-x: auto; gap: 8px; padding: 0 15px 5px 15px;
    scroll-behavior: smooth;
  }
  
  /* Barre de défilement style navigateur pour PC */
  #chat-options-scroll::-webkit-scrollbar { height: 4px; }
  #chat-options-scroll::-webkit-scrollbar-track { background: transparent; }
  #chat-options-scroll::-webkit-scrollbar-thumb { background: #007bff; border-radius: 10px; visibility: hidden; }
  #chat-options-scroll:hover::-webkit-scrollbar-thumb { visibility: visible; }

  #chat-options-scroll button { 
    white-space: nowrap; background: transparent; border: 1.5px solid #007bff; 
    color: #007bff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; 
    cursor: pointer; font-weight: 600; transition: 0.2s;
  }
  #chat-options-scroll button:hover { background: #007bff; color: white; }

  /* --- GRILLE RÉSEAUX SOCIAUX (TON ANCIENNE VERSION) --- */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; width: 100%; }
  .contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; color: white !important; font-size: 0.8rem; font-weight: 600; text-decoration: none !important; }

  #chat-footer { padding: 8px; text-align: center; font-size: 10px; opacity: 0.7; border-top: 1px solid var(--global-divider-color); color: var(--global-text-color); }

  @media (max-width: 576px) { #chat-wrapper { right: 85px; } #chat-container { width: 300px; right: -15px; } }
</style>

<script>
  const isFrench = {{ is_fr }};
  const socialLinks = {
    linkedin: "https://www.linkedin.com/in/omar-essalmani",
    email: "mailto:omaressalmani0@gmail.com",
    github: "https://github.com/omaressalmani",
    instagram: "https://www.instagram.com/essalmaniomar"
  };

  window.addEventListener('load', () => {
    setTimeout(() => {
      if (document.getElementById('chat-container').classList.contains('chat-hidden')) {
        toggleChat();
        sendBotMessage(isFrench ? "Salut ! Je suis l'assistant d'Omar. 👋" : "Hi! I'm Omar's assistant. 👋");
      }
    }, 2500);
  });

  function toggleChat() {
    document.getElementById('chat-container').classList.toggle('chat-hidden');
    document.querySelector('.notification-badge').style.display = 'none';
  }

  function sendBotMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    chatMessages.appendChild(bMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendUserMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    chatMessages.appendChild(uMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function botAnswer(type) {
    if (type === 'projects') {
      sendUserMessage(isFrench ? "Voir les projets" : "See projects");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/projects/' | relative_url }}" : "{{ '/projects/' | relative_url }}", 1000);
    } 
    else if (type === 'cv') {
      sendUserMessage(isFrench ? "Consulter le CV" : "View Resume");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/cv/' | relative_url }}" : "{{ '/cv/' | relative_url }}", 1000);
    } 
    else if (type === 'skills') {
      sendUserMessage(isFrench ? "Compétences" : "Skills");
      sendBotMessage(isFrench ? "Expert en CAO (SolidWorks, CATIA), simulation FEA et dispositifs médicaux [cite: 1, 11, 55]." : "Expert in CAD (SolidWorks, CATIA), FEA simulation, and medical devices[cite: 1, 11, 55].");
    }
    else if (type === 'location') {
      sendUserMessage(isFrench ? "Mobilité" : "Location");
      sendBotMessage(isFrench ? "Basé en France, mobilité nationale, disponible immédiatement [cite: 3]." : "Based in France, national mobility, available immediately[cite: 3].");
    }
    else if (type === 'contact_menu') {
      sendUserMessage("Contact");
      sendBotMessage(isFrench ? "Où préférez-vous me joindre ?" : "Where would you like to connect?");
      injectContactGrid();
    }
  }

  function injectContactGrid() {
    const chatMessages = document.getElementById('chat-messages');
    const grid = document.createElement('div');
    grid.className = "contact-grid";
    grid.innerHTML = `
      <a href="${socialLinks.linkedin}" target="_blank" class="contact-btn" style="background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="${socialLinks.email}" class="contact-btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email</a>
      <a href="${socialLinks.github}" target="_blank" class="contact-btn" style="background:#333;"><i class="fa-brands fa-github"></i> GitHub</a>
      <a href="${socialLinks.instagram}" target="_blank" class="contact-btn" style="background:#e4405f;"><i class="fa-brands fa-instagram"></i> Instagram</a>
    `;
    chatMessages.appendChild(grid);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
