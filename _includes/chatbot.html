{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
          <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
          <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's AI Assistant</strong>
          <span class="typing-status">{% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}</span>
        </div>
      </div>
      
      <div class="header-actions">
        <button onclick="clearChat()" class="action-chat-btn" title="{% if is_fr %}Effacer{% else %}Clear{% endif %}">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        <button onclick="toggleChat()" class="action-chat-btn close-btn">&times;</button>
      </div>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-options-container">
      <button class="scroll-btn scroll-left" onclick="scrollOptions('left')" style="display:none;">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div id="chat-options-scroll">
        <div id="chat-options">
          <button onclick="botAnswer('projects')">🚀 {% if is_fr %}Projets{% else %}Projects{% endif %}</button>
          <button onclick="botAnswer('cv')">📄 {% if is_fr %}CV{% else %}Resume{% endif %}</button>
          <button onclick="botAnswer('skills')">💡 {% if is_fr %}Compétences{% else %}Skills{% endif %}</button>
          <button onclick="botAnswer('experience')">🏢 {% if is_fr %}Expérience{% else %}Experience{% endif %}</button>
          <button onclick="botAnswer('formation')">🎓 {% if is_fr %}Formation{% else %}Education{% endif %}</button>
          <button onclick="botAnswer('contact_menu')">📱 Contact</button>
        </div>
      </div>
      <button class="scroll-btn scroll-right" onclick="scrollOptions('right')">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div id="chat-input-container">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="{% if is_fr %}Posez votre question...{% else %}Ask your question...{% endif %}"
        onkeypress="handleKeyPress(event)"
      >
      <button id="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>

    <div id="chat-footer">
      <span>{% if is_fr %}Développé par{% else %}Developed by{% endif %} <strong>Omar ESSALMANI</strong></span>
    </div>

  </div> </div> <style>
  /* --- POSITIONNEMENT ET STRUCTURE --- */
  #chat-wrapper {

    left: 30px;

    width: 60px;

    color: white;

  }

  }

  #chat-open-btn i {
    display: inline-block;
    animation: robot-wiggle 4s infinite;
  }

  @keyframes robot-wiggle {
    0%, 90% { transform: rotate(0deg); }
    92% { transform: rotate(15deg); }
    95% { transform: rotate(-15deg); }
    97% { transform: rotate(15deg); }
    100% { transform: rotate(0deg); }
  }

  .notification-badge {

  @keyframes fadeInChat {
