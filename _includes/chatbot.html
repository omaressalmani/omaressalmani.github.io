<script type="text/javascript">
  (function(){
    d=document;
    s=d.createElement("script");
    s.src="https://sitespeak.ai/chatbots/3b45485a-f01d-4b59-80c3-a1513617088b.js";
    s.async=1;
    d.getElementsByTagName("head")[0].appendChild(s);
  })();
</script>

<style>
  /* --- POSITIONNEMENT ET DÉCALAGE GAUCHE --- */
  #sitespeakai-chat-button, 
  #sitespeakai-widget-container {
    right: 180px !important;
    bottom: 30px !important;
    z-index: 999999 !important;
  }

  /* --- ALIGNEMENT DES COULEURS (Basé sur votre code bleu #007bff) --- */
  /* Note : Ces sélecteurs tentent de cibler l'iframe si le service le permet */
  #sitespeakai-chat-window header,
  .sitespeakai-chat-window-header {
    background-color: #007bff !important; /* Bleu identique à votre bouton Contact  */
    background: linear-gradient(135deg, #007bff, #00c6ff) !important;
  }

  /* --- SUPPRESSION DU "POWERED BY" --- */
  /* On masque l'élément qui contient la mention SiteSpeakAI en bas  */
  [class*="powered-by"], 
  [id*="powered-by"],
  .sitespeakai-powered-by {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
  }

  /* Ajustements Mobile */
  @media (max-width: 576px) {
    #sitespeakai-chat-button { right: 100px !important; }
  }
</style>

<script>
  window.addEventListener('load', function() {
    // 1. Correction du Titre dans l'onglet/header du widget
    const updateChatTitle = setInterval(function() {
      // On cherche les éléments de texte dans le widget qui pourraient contenir "omaar"
      const allElements = document.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.innerText === 'omaar') {
          el.innerText = "Omar's Tech Assistant!"; [cite: 2]
        }
      });
      
      // Si on a trouvé et remplacé, on peut arrêter l'intervalle après quelques secondes
    }, 500);

    // Arrêt de la recherche après 10 secondes pour économiser les ressources
    setTimeout(() => clearInterval(updateChatTitle), 10000);

    // 2. Ouverture automatique après 3 secondes
    setTimeout(function() {
      const chatBtn = document.getElementById('sitespeakai-chat-button') || document.querySelector('.sitespeakai-chat-button');
      if (chatBtn) chatBtn.click();
    }, 3000);
  });
</script>
