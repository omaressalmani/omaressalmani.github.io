{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
            <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
            <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's Tech Assistant</strong>
          <span class="typing-status">{% if is_fr %}IA spécialisée en ingénierie{% else %}Engineering Specialized AI{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="{% if is_fr %}Posez une question technique...{% else %}Ask a technical question...{% endif %}" onkeypress="handleKeyPress(event)">
      <button onclick="processInput()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <div id="chat-options">
      <button onclick="botAnswer('projects')">🚀 Projets</button>
      <button onclick="botAnswer('contact_menu')">📱 Contact</button>
    </div>
  </div>
</div>

<style>
  #chat-wrapper { position: fixed; bottom: 30px; right: 100px; z-index: 10001; }
  #chat-open-btn { 
    width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; border: none; cursor: pointer; box-shadow: 0 8px 25px rgba(0,123,255,0.4); 
    font-size: 24px; position: relative; transition: 0.3s;
  }
  #chat-open-btn i { display: inline-block; animation: robot-wiggle 4s infinite; }
  @keyframes robot-wiggle { 0%, 90% { transform: rotate(0deg); } 92% { transform: rotate(15deg); } 95% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

  #chat-container { 
    width: 350px; height: 550px; max-height: 85vh; background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.1); border-radius: 24px; 
    display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.15); 
    position: absolute; bottom: 80px; right: 0; overflow: hidden; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: bottom right;
  }
  [data-theme='dark'] #chat-container { background: rgba(28, 28, 30, 0.98); border-color: rgba(255,255,255,0.1); color: white; }
  #chat-container.chat-hidden { visibility: hidden; opacity: 0; transform: scale(0.7) translateY(100px); }

  #chat-header { background: #007bff; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
  .bot-profile { display: flex; align-items: center; gap: 10px; }
  .bot-profile img { width: 40px; height: 40px; border-radius: 50%; background: white; object-fit: cover; }
  
  #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .message { padding: 10px 14px; border-radius: 15px; font-size: 0.9rem; max-width: 85%; line-height: 1.4; animation: fadeIn 0.3s; }
  .bot-msg { background: #f0f0f2; align-self: flex-start; color: #1c1c1e; }
  [data-theme='dark'] .bot-msg { background: #3a3a3c; color: #f2f2f7; }
  .user-msg { background: #007bff; color: white; align-self: flex-end; }

  #chat-input-area { display: flex; padding: 10px; border-top: 1px solid rgba(0,0,0,0.05); background: var(--global-bg-color); }
  #chat-input-area input { flex: 1; border: none; padding: 8px 12px; border-radius: 20px; background: #f0f0f2; font-size: 0.85rem; outline: none; }
  [data-theme='dark'] #chat-input-area input { background: #2c2c2e; color: white; }
  #chat-input-area button { background: none; border: none; color: #007bff; margin-left: 10px; cursor: pointer; font-size: 1.1rem; }

  #chat-options { padding: 10px; display: flex; gap: 8px; justify-content: center; }
  #chat-options button { background: none; border: 1.5px solid #007bff; color: #007bff; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
</style>

<script>
  const isFrench = {{ is_fr }};
  const socialLinks = { linkedin: "https://www.linkedin.com/in/omar-essalmani", email: "mailto:omaressalmani0@gmail.com" };

  // Base de connaissances technique (100% local/gratuit)
  const techKnowledge = {
    "solidworks": isFrench ? "Omar utilise SolidWorks pour la conception mécanique et la mise en plan technique depuis plusieurs années." : "Omar has been using SolidWorks for mechanical design and technical drawing for several years.",
    "catia": isFrench ? "Il maîtrise CATIA V5 pour le surfaçage et la conception de systèmes complexes." : "He is proficient in CATIA V5 for surfacing and complex systems design.",
    "ansys": isFrench ? "Omar réalise des simulations FEA (analyse par éléments finis) via Ansys pour valider la résistance des pièces." : "Omar performs FEA simulations via Ansys to validate part strength.",
    "ensam": isFrench ? "Il est étudiant à l'ENSAM, une école d'ingénieurs prestigieuse spécialisée en génie industriel et mécanique." : "He is a student at ENSAM, a prestigious engineering school specialized in industrial and mechanical engineering.",
    "utc": isFrench ? "Il suit également un cursus à l'UTC, renforçant ses compétences en conception mécanique intégrée." : "He is also studying at UTC, strengthening his skills in integrated mechanical design.",
    "python": isFrench ? "Omar utilise Python pour automatiser des calculs d'ingénierie et traiter des données techniques." : "Omar uses Python to automate engineering calculations and process technical data."
  };

  window.addEventListener('load', () => {
    setTimeout(() => {
        toggleChat();
        sendBotMessage(isFrench ? "Bonjour ! Je connais tout sur le parcours d'Omar. Posez-moi une question technique !" : "Hi! I know everything about Omar's background. Ask me a technical question!");
    }, 2500);
  });

  function toggleChat() { document.getElementById('chat-container').classList.toggle('chat-hidden'); }

  function handleKeyPress(e) { if (e.key === 'Enter') processInput(); }

  function processInput() {
    const input = document.getElementById('user-input');
    const text = input.value.trim().toLowerCase();
    if (!text) return;

    sendUserMessage(input.value);
    input.value = "";

    setTimeout(() => {
        let found = false;
        for (let key in techKnowledge) {
            if (text.includes(key)) {
                sendBotMessage(techKnowledge[key]);
                found = true;
                break;
            }
        }
        if (!found) {
            sendBotMessage(isFrench ? "C'est une question intéressante ! Je vous suggère de regarder ses projets ou de le contacter directement pour plus de détails." : "That's an interesting question! I suggest checking his projects or contacting him directly for more details.");
        }
    }, 600);
  }

  function sendBotMessage(text) {
    const msgDiv = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    msgDiv.appendChild(bMsg);
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  function sendUserMessage(text) {
    const msgDiv = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    msgDiv.appendChild(uMsg);
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  function botAnswer(type) {
    if (type === 'projects') {
        sendUserMessage(isFrench ? "Voir les projets" : "See projects");
        setTimeout(() => window.location.href = isFrench ? "{{ '/fr/projects/' | relative_url }}" : "{{ '/projects/' | relative_url }}", 1000);
    } else if (type === 'contact_menu') {
        sendBotMessage(isFrench ? "Vous pouvez le joindre sur <a href='"+socialLinks.linkedin+"' target='_blank'>LinkedIn</a> ou par <a href='"+socialLinks.email+"'>Email</a>." : "You can reach him on <a href='"+socialLinks.linkedin+"' target='_blank'>LinkedIn</a> or via <a href='"+socialLinks.email+"'>Email</a>.");
    }
  }
</script>
