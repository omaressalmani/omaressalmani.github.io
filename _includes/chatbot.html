{% assign is_fr = false %}
{% if page.url contains '/fr/' or page.url == '/fr/' %}{% assign is_fr = true %}{% endif %}

<div id="chat-wrapper">
  <button id="chat-open-btn" onclick="toggleChat()">
    <span class="notification-badge">1</span>
    <i class="fa-solid fa-robot"></i>
  </button>

  <div id="chat-container" class="chat-hidden">
    <div id="chat-header">
      <div class="bot-profile">
        <div class="avatar-wrapper">
          <img src="{{ '/assets/img/prof_pic.jpg' | relative_url }}" alt="Omar" onerror="this.src='https://ui-avatars.com/api/?name=OE&background=007bff&color=fff'">
          <span class="online-indicator"></span>
        </div>
        <div class="bot-details">
          <strong>Omar's Tech Assistant</strong>
          <span class="typing-status">{% if is_fr %}Répond instantanément{% else %}Replies instantly{% endif %}</span>
        </div>
      </div>
      <button onclick="toggleChat()" class="close-chat-btn">&times;</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-options-container">
      <div id="chat-options-scroll">
        <button onclick="botAnswer('projects')">🚀 {% if is_fr %}Projets{% else %}Projects{% endif %}</button>
        <button onclick="botAnswer('cv')">📄 {% if is_fr %}Mon CV{% else %}Resume{% endif %}</button>
        <button onclick="botAnswer('contact_menu')">📱 Contact</button>
        <button onclick="botAnswer('skills')">🛠️ {% if is_fr %}Compétences{% else %}Skills{% endif %}</button>
        <button onclick="botAnswer('location')">📍 {% if is_fr %}Mobilité{% else %}Location{% endif %}</button>
      </div>
    </div>

    <div id="chat-footer">
      <span>Developed by <strong>Omar ESSALMANI</strong></span>
    </div>
  </div>
</div>

<style>
  /* --- POSITIONNEMENT (DÉCALÉ À GAUCHE) --- */
  #chat-wrapper { 
    position: fixed; 
    bottom: 30px; 
    right: 110px; /* Décalé pour laisser la place au bouton "Back to Top" */
    z-index: 10000; 
  }

  #chat-open-btn { 
    width: 60px; height: 60px; border-radius: 50%; 
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white; border: none; cursor: pointer; 
    box-shadow: 0 8px 25px rgba(0,123,255,0.4); 
    font-size: 24px; position: relative; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #chat-open-btn i { display: inline-block; animation: robot-wiggle 4s infinite; }
  @keyframes robot-wiggle { 0%, 90% { transform: rotate(0deg); } 92% { transform: rotate(15deg); } 95% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }

  .notification-badge {
    position: absolute; top: -2px; right: -2px; background: #ff3b30; color: white;
    font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 2px solid white; font-weight: bold;
  }

  /* --- FENÊTRE DE CHAT ADAPTATIVE (DARK/LIGHT) --- */
  #chat-container { 
    width: 350px; height: 520px; max-height: 80vh;
    background: var(--global-bg-color, #ffffff); /* Utilise la variable du thème */
    backdrop-filter: blur(10px); 
    border: 1px solid var(--global-divider-color, rgba(0,0,0,0.1)); 
    border-radius: 24px; 
    display: flex; flex-direction: column; 
    box-shadow: 0 15px 50px rgba(0,0,0,0.15); 
    position: absolute; bottom: 80px; right: 0; 
    overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: bottom right;
    color: var(--global-text-color, #1c1c1e);
  }
  
  #chat-container.chat-hidden { visibility: hidden; opacity: 0; transform: scale(0.7) translateY(100px); }

  #chat-header { background: #007bff; color: white; padding: 18px 15px; display: flex; align-items: center; justify-content: space-between; }
  .bot-profile { display: flex; align-items: center; gap: 12px; }
  .bot-profile img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: white; border: 2px solid rgba(255,255,255,0.2); }
  .close-chat-btn { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }

  #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  
  /* Bulles de messages dynamiques */
  .message { padding: 12px 16px; border-radius: 20px; font-size: 0.92rem; max-width: 85%; animation: fadeInChat 0.4s ease forwards; line-height: 1.4; }
  .bot-msg { 
    background: var(--global-card-bg-color, #f0f0f2); 
    color: var(--global-text-color, #1c1c1e); 
    align-self: flex-start; border-bottom-left-radius: 4px; 
  }
  .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  /* --- HORIZONTAL SMART PROMPTS --- */
  #chat-options-container {
    padding: 10px 0;
    border-top: 1px solid var(--global-divider-color, rgba(0,0,0,0.05));
    background: var(--global-bg-color);
  }
  #chat-options-scroll {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 0 15px;
    scrollbar-width: none; /* Firefox */
  }
  #chat-options-scroll::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
  
  #chat-options-scroll button { 
    white-space: nowrap;
    background: transparent; 
    border: 1.5px solid #007bff; 
    color: #007bff; 
    padding: 6px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; 
    transition: 0.2s; font-weight: 600;
  }
  #chat-options-scroll button:hover { background: #007bff; color: white; }

  /* --- FOOTER TYPE SITESPEAKAI --- */
  #chat-footer {
    padding: 8px;
    text-align: center;
    font-size: 10px;
    background: var(--global-bg-color);
    border-top: 1px solid var(--global-divider-color, rgba(0,0,0,0.05));
    opacity: 0.7;
    color: var(--global-text-color);
  }

  /* Responsive Mobile */
  @media (max-width: 576px) {
    #chat-wrapper { right: 85px; }
    #chat-container { width: 300px; right: -15px; }
  }

  @keyframes fadeInChat { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
  const isFrench = {{ is_fr }};
  const socialLinks = {
    linkedin: "https://www.linkedin.com/in/omar-essalmani",
    email: "mailto:omaressalmani0@gmail.com",
    github: "https://github.com/omaressalmani",
    instagram: "https://www.instagram.com/essalmaniomar"
  };

  const botResponses = {
    skills: isFrench ? "Expert en CAO (SolidWorks, CATIA, Creo), simulation FEA (Ansys, Abaqus) et fabrication (Impression 3D, Usinage)." : "Expert in CAD (SolidWorks, CATIA, Creo), FEA simulation (Ansys, Abaqus), and manufacturing (3D Printing, Machining).",
    location: isFrench ? "Je suis basé en France avec une mobilité nationale et disponible immédiatement (Titre APS)." : "I am based in France with national mobility and available immediately."
  };

  window.addEventListener('load', () => {
    setTimeout(() => {
      const chat = document.getElementById('chat-container');
      if (chat.classList.contains('chat-hidden')) {
        toggleChat();
        setTimeout(() => {
            sendBotMessage(isFrench ? "Salut ! Je suis l'assistant d'Omar. 👋" : "Hi! I'm Omar's assistant. 👋");
            setTimeout(() => {
                sendBotMessage(isFrench ? "Je connais tout sur son parcours ENSAM & UTC. Que souhaitez-vous savoir ?" : "I know everything about his ENSAM & UTC background. What would you like to know?");
            }, 1000);
        }, 500);
      }
    }, 2500);
  });

  function toggleChat() {
    const chat = document.getElementById('chat-container');
    chat.classList.toggle('chat-hidden');
    document.querySelector('.notification-badge').style.display = 'none';
  }

  function sendBotMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const bMsg = document.createElement('div');
    bMsg.className = "message bot-msg";
    bMsg.innerHTML = text;
    chatMessages.appendChild(bMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendUserMessage(text) {
    const chatMessages = document.getElementById('chat-messages');
    const uMsg = document.createElement('div');
    uMsg.className = "message user-msg";
    uMsg.innerText = text;
    chatMessages.appendChild(uMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function botAnswer(type) {
    if (type === 'projects') {
      sendUserMessage(isFrench ? "Voir les projets" : "See projects");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/projects/' | relative_url }}" : "{{ '/projects/' | relative_url }}", 1000);
    } 
    else if (type === 'cv') {
      sendUserMessage(isFrench ? "Consulter le CV" : "View Resume");
      setTimeout(() => window.location.href = isFrench ? "{{ '/fr/cv/' | relative_url }}" : "{{ '/cv/' | relative_url }}", 1000);
    } 
    else if (type === 'skills') {
      sendUserMessage(isFrench ? "Compétences" : "Skills");
      setTimeout(() => sendBotMessage(botResponses.skills), 600);
    }
    else if (type === 'location') {
      sendUserMessage(isFrench ? "Mobilité" : "Location");
      setTimeout(() => sendBotMessage(botResponses.location), 600);
    }
    else if (type === 'contact_menu') {
      sendUserMessage("Contact");
      setTimeout(() => {
        sendBotMessage(isFrench ? "Où préférez-vous me joindre ?" : "Where would you like to connect?");
        injectContactGrid();
      }, 600);
    }
  }

  function injectContactGrid() {
    const chatMessages = document.getElementById('chat-messages');
    const grid = document.createElement('div');
    grid.className = "contact-grid";
    grid.innerHTML = `
      <a href="${socialLinks.linkedin}" target="_blank" class="contact-btn" style="background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="${socialLinks.email}" class="contact-btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email</a>
    `;
    chatMessages.appendChild(grid);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
